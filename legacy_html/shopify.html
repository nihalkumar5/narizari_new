<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopify Services | NariZari</title>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="shopify.css">
</head>
<body>

  <nav class="shopify-nav">
    <div class="logo">
      <a href="index.html">Nari<span>Zari</span></a>
    </div>
    <div class="nav-center">
      <a href="index.html#services">Services</a>
      <a href="index.html#about">About Us</a>
      <a href="index.html#case-studies">Cases</a>
    </div>
    <div class="nav-right">
      <a href="#signup">Sign Up</a>
      <a href="#signup" class="icon-btn">
        <i class="fas fa-arrow-right"></i>
      </a>
    </div>
  </nav>

  <main class="shopify-main">
    
    <!-- LEFT COLUMN -->
    <div class="left-col">
      
      <div class="huge-title">
        <div class="row-1">UNLIMITED</div>
        <div class="row-2">ECOMMERCE</div>
        <div class="row-3">
          <div class="avatar-group">
            <img src="https://i.pravatar.cc/150?img=5" alt="Avatar">
            <img src="https://i.pravatar.cc/150?img=9" alt="Avatar">
            <img src="https://i.pravatar.cc/150?img=12" alt="Avatar">
            <div class="orange-circle"></div>
          </div>
          SCALING
        </div>
      </div>

      <div class="text-blocks">
        <p>Our Solutions</p>
        <p>We Provide The Full<br>Funnel Approach</p>
      </div>

      <div class="bottom-left">
        <div class="play-video">
          <button class="play-btn">
            <i class="fas fa-play"></i>
          </button>
          <div class="play-text">
            Let's See<br>How We Did It
          </div>
        </div>

        <div class="pill-tags">
          <div class="pill">Custom Themes</div>
          <div class="pill">Conversion Audits</div>
          <div class="pill">Speed Optimization</div>
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="right-col">
      
      <!-- Big Lavender Folder -->
      <div class="folder-card card-lavender">
        <div class="lavender-top">
          <div class="lavender-title">Your<br>Business<br>Boost</div>
          <div style="display: flex; gap: 5px;">
            <div style="width: 8px; height: 8px; background: #fff; border-radius: 50%;"></div>
            <div style="width: 8px; height: 8px; border: 1px solid #fff; border-radius: 50%;"></div>
          </div>
        </div>
        
        <img src="assets/shopify_hero.png" alt="Hero Model" class="hero-model">
        
        <div class="demo-bar">
          <span style="font-weight: 500; font-size: 1.1rem;">Book Demo Call</span>
          <button class="demo-btn">
            <i class="fas fa-arrow-right"></i>
          </button>
        </div>
      </div>

      <!-- Small Folders Row -->
      <div class="bottom-folders">
        
        <!-- Orange -->
        <div class="small-folder card-orange">
          <div class="small-folder-title">Unique<br>Business Solutions</div>
          <div class="small-folder-bottom">
            <i class="fas fa-cubes" style="font-size: 2.5rem;"></i>
          </div>
        </div>

        <!-- Grey -->
        <div class="small-folder card-grey">
          <div class="small-folder-title" style="display: flex; justify-content: space-between;">
            <div style="display: flex; gap: 5px; align-items: center;">
              <div style="width: 6px; height: 6px; background: #000; border-radius: 50%;"></div>
              <div style="width: 6px; height: 6px; border: 1px solid #000; border-radius: 50%;"></div>
            </div>
            <i class="fas fa-arrow-up-right-from-square" style="font-size: 1.5rem; font-weight: 300;"></i>
          </div>
          <div class="small-folder-bottom">
            Our Case<br>Studies
          </div>
        </div>

        <!-- Yellow -->
        <div class="small-folder card-yellow">
          <div class="small-folder-title">Successful<br>Projects</div>
          <div class="small-folder-bottom yellow-number">
            700<sup>+</sup>
          </div>
        </div>

      </div>

    </div>

  </main>

</body>
</html>
